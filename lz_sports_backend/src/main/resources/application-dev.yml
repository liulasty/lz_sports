spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lz_sports?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:!Theworld1949}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

jwt:
  key: ${JWT_SECRET}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    accessKeyId: ${OSS_ACCESS_KEY_ID}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
    bucketName: ${OSS_BUCKET_NAME:lz-sports-dev}

app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}

# ==============================================================================
# 日志配置
# ==============================================================================
logging:
  file:
    path: D:/lz-sports/docker/logs  # 日志文件存储目录
  logback:
    rollingpolicy:
      max-file-size: 100MB  # 单个日志文件最大大小
      max-history: 30       # 日志文件保留天数
      total-size-cap: 5GB   # 日志文件总大小上限
  level:
    com.lz.mapper: debug    # 指定 Mapper 包日志级别为 DEBUG（打印SQL）
