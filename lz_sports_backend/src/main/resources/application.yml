# ==============================================================================
# 服务器基础配置
# ==============================================================================
server:
  # 应用启动端口
  port: ${SERVER_PORT:8080}
  # Servlet 上下文路径（访问根路径，/ 表示无需额外前缀）
  servlet:
    context-path: /

# ==============================================================================
# Spring 核心配置
# ==============================================================================
spring:
  # 应用名称（用于服务注册/日志标识等）
  application:
    name: lz-sports-backend
  # 激活的配置文件（优先级：环境变量 > 默认值dev）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Spring Security 基础认证配置（用户名/密码从环境变量读取，为空则不启用）
  security:
    user:
      name: ${SECURITY_USER_NAME:}
      password: ${SECURITY_USER_PASSWORD:}
  # 数据库连接配置（使用 HikariCP 连接池，参数从环境变量读取）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 8.x 驱动类
    url: ${DB_URL}                               # 数据库连接地址
    username: ${DB_USERNAME}                     # 数据库用户名
    password: ${DB_PASSWORD}                     # 数据库密码
    type: com.zaxxer.hikari.HikariDataSource     # 指定高性能 Hikari 连接池
  # Redis 配置
  data:
    redis:
      repositories:
        enabled: false  # 禁用 Redis 仓库自动配置（避免冲突）
      host: ${REDIS_HOST}       # Redis 服务器地址（从环境变量读取）
      port: ${REDIS_PORT}       # Redis 端口号
      database: ${REDIS_DB}     # Redis 数据库编号（默认0）
      password: ${REDIS_PASSWORD:}  # Redis 密码（为空则不认证）
  # SQL 初始化配置（嵌入式数据库/首次启动时执行）
  sql:
    init:
      mode: embedded  # 初始化模式：仅嵌入式数据库生效（如 H2）
      schema-locations: classpath:sql/lz_sports.sql  # 表结构初始化脚本路径
      data-locations: classpath:sql/data.sql         # 初始化数据脚本路径
  # 邮件发送配置（SMTP 协议）
  mail:
    host: ${MAIL_HOST}         # 邮件服务器地址（如 smtp.qq.com）
    port: ${MAIL_PORT}         # 邮件服务器端口（如 587）
    username: ${MAIL_USERNAME} # 发件人邮箱账号
    password: ${MAIL_PASSWORD} # 邮箱授权码/密码
    protocol: smtp             # 邮件协议
    default-encoding: UTF-8    # 邮件默认编码
    properties:
      mail:
        smtp:
          auth: true           # 启用 SMTP 认证
          starttls:
            enable: true       # 启用 STARTTLS 加密
            required: true     # 强制要求 STARTTLS 加密

