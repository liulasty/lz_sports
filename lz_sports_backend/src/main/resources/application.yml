server:
  port: 8080
  # 配置上下文路径
  servlet:
    context-path: /api

spring:
  application:
    name: lz-sports-backend
  security:
    user:
      name: ${SECURITY_USER_NAME:admin}
      password: ${SECURITY_USER_PASSWORD:admin123}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/lz_sports?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    type: com.zaxxer.hikari.HikariDataSource
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:!Theworld1949}

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:2312034544@qq.com}
    password: ${MAIL_PASSWORD:jpsvzykypsbndjae}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-enums-package: com.lz.common.enums
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Custom Config
jwt:
  key: ${JWT_SECRET:lz_sports_7f8e9d2c-4b1a-3e5f-8c7d-9a2b4e6f1d8a}
  expiration: 43200000 # 12 hours

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    accessKeyId: ${OSS_ACCESS_KEY_ID:your-access-key-id}
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
    bucketName: ${OSS_BUCKET_NAME:lz-sports}

logging:
  file:
    path: logs
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 5GB
  level:
    com.lz.mapper: debug
