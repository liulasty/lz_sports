# ==============================================================================
# MyBatis-Plus 配置（ORM 框架增强）
# ==============================================================================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml  # Mapper XML 文件路径
  type-enums-package: com.lz.common.enums   # 枚举类型扫描包
  configuration:
    map-underscore-to-camel-case: true      # 开启下划线转驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL 日志输出到控制台
  global-config:
    db-config:
      id-type: auto                         # 主键生成策略：数据库自增
      logic-delete-field: deleted           # 逻辑删除字段名
      logic-delete-value: 1                 # 逻辑删除标识值
      logic-not-delete-value: 0             # 逻辑未删除标识值

# ==============================================================================
# 自定义业务配置
# ==============================================================================
# JWT 令牌配置
jwt:
  key: ${JWT_SECRET}                # JWT 签名密钥（从环境变量读取）
  expiration: 43200000              # 令牌过期时间（12小时，单位：毫秒）

# 阿里云 OSS 对象存储配置
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT}               # OSS 地域节点地址
    accessKeyId: ${OSS_ACCESS_KEY_ID}       # 阿里云 AccessKey ID
    accessKeySecret: ${OSS_ACCESS_KEY_SECRET} # 阿里云 AccessKey Secret
    bucketName: ${OSS_BUCKET_NAME}          # OSS 存储空间名称

# 应用基础配置
app:
  upload-dir: ${APP_UPLOAD_DIR:uploads}     # 文件上传目录（默认uploads，可通过环境变量覆盖）

# ==============================================================================
# 日志配置
# ==============================================================================
logging:
  file:
    path: ${APP_LOG_DIR:/app/logs/gaode_demo}  # 日志文件存储目录
  logback:
    rollingpolicy:
      max-file-size: 100MB  # 单个日志文件最大大小
      max-history: 30       # 日志文件保留天数
      total-size-cap: 5GB   # 日志文件总大小上限
  level:
    com.lz.mapper: debug    # 指定 Mapper 包日志级别为 DEBUG（打印SQL）