name: Backend Smoke CI

on:
  push:
    paths:
      - 'lz_sports_backend/**'
      - '.github/workflows/backend-smoke-ci.yml'
  pull_request:
    paths:
      - 'lz_sports_backend/**'
      - '.github/workflows/backend-smoke-ci.yml'

jobs:
  backend-smoke-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lz_sports_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend non-container baseline tests
        run: mvn -Pnon-container-baseline test
