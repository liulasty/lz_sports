services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha
    networks:
      - appnet
    depends_on:
      - mysql

  backend:
    image: lz-sports-backend:${IMAGE_VERSION:-latest}
    container_name: backend
    build:
      context: ./lz_sports_backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/lz_sports_backend-0.0.1-SNAPSHOT.jar
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECURITY_USER_NAME: ${SECURITY_USER_NAME}
      SECURITY_USER_PASSWORD: ${SECURITY_USER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      APP_UPLOAD_DIR: ${APP_UPLOAD_DIR}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SERVER_PORT: ${BACKEND_PORT:-8080}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx1g -Xms512m}
      APP_LOG_DIR: ${LOG_PATH}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - appnet

  frontend:
    image: lz-sports-frontend:${IMAGE_VERSION:-latest}
    container_name: frontend
    build:
      context: ./lz_sports_frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_PORT: ${FRONTEND_PORT:-80}
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:${BACKEND_PORT:-8080}
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
