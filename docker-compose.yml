services:
  backend:
    build:
      context: ./lz_sports_backend
      dockerfile: Dockerfile
      args:
        JAR_FILE: target/lz_sports_backend-0.0.1-SNAPSHOT.jar
    image: lz-sports-backend:latest
    container_name: lz-sports-backend
    ports:
      - "8080:8080"
    env_file:
      - ./lz_sports_backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: ${DB_URL_DOCKER:-jdbc:mysql://host.docker.internal:3306/lz_sports?serverTimezone=GMT%2B8&characterEncoding=utf-8&useSSL=false}
      REDIS_HOST: ${REDIS_HOST_DOCKER:-host.docker.internal}
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: ./lz_sports_frontend
      dockerfile: Dockerfile
    image: lz-sports-frontend:latest
    container_name: lz-sports-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
